<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <bodystyle="margin:0;padding:0;background:#F5F5F7;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F5F7;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FFFFFF;border-radius:24px;">
            <tr>
              <td style="padding:32px 28px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#16181C;">
                <img src="https://www.voltra-app.fr/icons/apple-touch-icon.png" width="52" height="52" alt="Voltra" style="display:block;border-radius:15px;margin-bottom:24px;" />
                <h1 style="margin:0 0 10px;font-size:24px;line-height:1.2;font-weight:800;">Salut {{ .Data.name }}, voici ton code</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#55595F;">Retourne dans Voltra et entre ce code pour activer ton compte.</p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#16181C;border-radius:16px;">
                  <tr>
                    <td align="center" style="padding:20px 8px;font-size:34px;line-height:1;font-weight:800;letter-spacing:8px;color:#9BE84F;">{{ .Token }}</td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#55595F;">Ce code ne sert qu'une fois et expire rapidement. Si tu n'as pas créé de compte Voltra, ignore simplement cet e-mail.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
